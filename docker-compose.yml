services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  temporal:
    image: temporalio/admin-tools:latest
    command: temporal server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongodb_data:
  ollama_data:
